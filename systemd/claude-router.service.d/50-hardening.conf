# WO-N1 / M-015 (owner ruling 2026-10-10): sandbox claude-router.
# Rollback: rm /etc/systemd/system/claude-router.service.d/50-hardening.conf && systemctl daemon-reload && systemctl restart claude-router
[Service]
NoNewPrivileges=yes
ProtectSystem=full
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
# D5 (2026-10-11) comment correction, directives unchanged. ReadWritePaths= is NOT a write confinement here:
# ProtectSystem=full makes only /usr, /boot, /efi and /etc read-only, so ${AI_SETUP_ROOT} and /run stay writable
# whatever this list says (systemd.exec: the allow-list semantics apply under ProtectSystem=strict).
# The list documents the router's writes and pre-opens them for a future strict mode:
#   ${AI_SETUP_ROOT}/state/router-usage.jsonl           every request (ROUTER_USAGE_LOG overrides)
#   ${AI_SETUP_ROOT}/state/compaction-archive/          only with ROUTER_D10_PRUNE=1 or ROUTER_D12_MASK=1 (ROUTER_ARCHIVE_DIR overrides)
#   /run/claude-router/fallback-state.json (+ fallback-state.json.<pid>.tmp, renamed into place)
#                                                      main-lane fallback badge (CLAUDE_ROUTER_FALLBACK_STATE overrides)
# The "-" prefix only means "ignore this entry if the path is missing at start"; it creates nothing. /run is tmpfs,
# so after a boot the router's own mkdir creates /run/claude-router on the first main-lane fallback. Under
# ProtectSystem=strict that mkdir would fail: add RuntimeDirectory=claude-router + RuntimeDirectoryPreserve=restart then.
ReadWritePaths=${AI_SETUP_ROOT}/state -/run/claude-router
